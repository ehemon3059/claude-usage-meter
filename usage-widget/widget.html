<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Claude Usage Meter</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <main class="dials">
    <svg id="speedo" class="dial" role="img" aria-label="Current session usage"></svg>
    <svg id="clock" class="dial" role="img" aria-label="Bangladesh time"><title id="clock-tip">Bangladesh time</title></svg>
    <svg id="fuel" class="dial" role="img" aria-label="Weekly usage"></svg>
  </main>
  <footer class="bar">
    <button id="refresh" class="btn" type="button" title="Read your usage from claude.ai now">
      <svg class="icon icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
      <span>Refresh</span>
    </button>
    <span id="status" class="status" role="status"></span>
    <span class="spacer"></span>
    <span class="author-label">Author</span>
    <button class="btn" type="button" data-link="github" title="github.com/ehemon3059/claude-usage-meter">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" /></svg>
      <span>GitHub</span>
    </button>
    <button class="btn" type="button" data-link="facebook" title="facebook.com/eh.emon3059">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" /></svg>
      <span>Facebook</span>
    </button>
  </footer>
  <div id="dev" class="dev" hidden>
    <label>Session <input id="dev-session" type="range" min="0" max="100" value="57" /></label>
    <label>Week <input id="dev-week" type="range" min="0" max="100" value="32" /></label>
  </div>
  <script src="gauges.js"></script>
  <script src="clock.js"></script>
  <script src="widget.js"></script>
</body>
</html>
